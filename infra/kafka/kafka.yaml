# Kafka (Strimzi, KRaft mode) — event backbone for the translation pipeline.
#
# Requires the Strimzi cluster operator to be installed first (it owns these
# CRDs). 3 persistent brokers, replication factor 3 / min.insync.replicas 2:
# horizontally scalable in the DHBW demo cluster. translation-api publishes to
# `translation-events` / `translation-errors`; the Spark job consumes them.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: main
  labels:
    strimzi.io/cluster: translation-kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: translation-kafka
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: translation-events
  labels:
    strimzi.io/cluster: translation-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "604800000"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: translation-errors
  labels:
    strimzi.io/cluster: translation-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "604800000"
