apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
spec:
  tls:
    - hosts:
        - analytics-ui.example.invalid
  rules:
    - host: analytics-ui.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
