apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-translation-analytics
  labels:
    app: grafana
data:
  translation-analytics.json: |
    {
      "uid": "translation-analytics",
      "title": "Translation Analytics",
      "tags": ["translation", "analytics", "prometheus"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "5s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Requests gesamt",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "kubernetes-prometheus" },
          "targets": [{ "refId": "A", "expr": "sum(translation_requests_total)", "legendFormat": "Requests" }],
          "fieldConfig": { "defaults": { "decimals": 0, "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto" }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests pro Minute",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "kubernetes-prometheus" },
          "targets": [{ "refId": "A", "expr": "sum(rate(translation_requests_total[1m])) * 60", "legendFormat": "Requests/min" }],
          "fieldConfig": { "defaults": { "decimals": 1, "unit": "reqpm" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto" }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Durchschnittslatenz",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "kubernetes-prometheus" },
          "targets": [{ "refId": "A", "expr": "sum(rate(translation_request_latency_ms_total[5m])) / sum(rate(translation_request_latency_ms_count[5m]))", "legendFormat": "avg latency" }],
          "fieldConfig": { "defaults": { "decimals": 0, "unit": "ms" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto" }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Fehlerquote",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "kubernetes-prometheus" },
          "targets": [{ "refId": "A", "expr": "(sum(increase(translation_requests_total{status=\"error\"}[$__range])) or vector(0)) / clamp_min((sum(increase(translation_requests_total[$__range])) or vector(0)), 1)", "legendFormat": "error rate" }],
          "fieldConfig": { "defaults": { "decimals": 2, "unit": "percentunit", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.05 }] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto" }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Request-Volumen",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "kubernetes-prometheus" },
          "targets": [{ "refId": "A", "expr": "sum(rate(translation_requests_total[1m])) * 60", "legendFormat": "Requests/min" }],
          "fieldConfig": { "defaults": { "decimals": 1, "unit": "reqpm" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "single", "sort": "none" } }
        },
        {
          "id": 6,
          "type": "bargauge",
          "title": "Top-Sprachpaare",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "kubernetes-prometheus" },
          "targets": [{ "refId": "A", "expr": "topk(10, sum by (language_pair) (increase(translation_requests_total[$__range])))", "legendFormat": "{{language_pair}}" }],
          "fieldConfig": { "defaults": { "decimals": 0, "unit": "short" }, "overrides": [] },
          "options": { "displayMode": "gradient", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "showUnfilled": true }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Latenzverlauf",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "kubernetes-prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(translation_request_latency_ms_total[5m])) / sum(rate(translation_request_latency_ms_count[5m]))", "legendFormat": "Gesamt" },
            { "refId": "B", "expr": "sum by (language_pair) (rate(translation_request_latency_ms_total[5m])) / sum by (language_pair) (rate(translation_request_latency_ms_count[5m]))", "legendFormat": "{{language_pair}}" }
          ],
          "fieldConfig": { "defaults": { "decimals": 0, "unit": "ms" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "none" } }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Fehlerquote und Fehleranzahl",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "kubernetes-prometheus" },
          "targets": [
            { "refId": "A", "expr": "(sum(rate(translation_requests_total{status=\"error\"}[5m])) or vector(0)) / clamp_min((sum(rate(translation_requests_total[5m])) or vector(0)), 0.001)", "legendFormat": "Fehlerquote" },
            { "refId": "B", "expr": "(sum(rate(translation_requests_total{status=\"error\"}[1m])) or vector(0)) * 60", "legendFormat": "Fehler/min" }
          ],
          "fieldConfig": { "defaults": { "decimals": 2 }, "overrides": [{ "matcher": { "id": "byName", "options": "Fehlerquote" }, "properties": [{ "id": "unit", "value": "percentunit" }] }, { "matcher": { "id": "byName", "options": "Fehler/min" }, "properties": [{ "id": "unit", "value": "reqpm" }, { "id": "decimals", "value": 1 }] }] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "none" } }
        },
        {
          "id": 9,
          "type": "bargauge",
          "title": "Fehlertypen",
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "kubernetes-prometheus" },
          "targets": [{ "refId": "A", "expr": "sum by (error_type) (increase(translation_requests_total{status=\"error\"}[$__range]))", "legendFormat": "{{error_type}}" }],
          "fieldConfig": { "defaults": { "decimals": 0, "unit": "short" }, "overrides": [] },
          "options": { "displayMode": "gradient", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "showUnfilled": true }
        },
        {
          "id": 10,
          "type": "text",
          "title": "Modellstatus",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 20 },
          "options": {
            "mode": "html",
            "content": "<div style=\"height:100%;min-height:250px;display:flex;flex-direction:column;gap:10px;\"><div style=\"color:#cfd6e4;font-size:13px;line-height:1.4;\">Live-Antwort von <code>/loaded-pairs</code></div><iframe src=\"https://translation-api.example.invalid/loaded-pairs\" title=\"Modellstatus\" style=\"flex:1;width:100%;min-height:210px;border:1px solid rgba(204,204,220,.2);border-radius:4px;background:#111217;color:#cfd6e4;\"></iframe><div style=\"font-size:12px;\"><a href=\"https://translation-api.example.invalid/loaded-pairs\" target=\"_blank\" rel=\"noopener noreferrer\">Modellstatus öffnen</a> · <a href=\"https://translation-api.example.invalid/health\" target=\"_blank\" rel=\"noopener noreferrer\">API Health</a></div></div>"
          }
        }
      ]
    }
