apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-tempo-config
  labels:
    app: grafana-tempo
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-tempo-storage
  labels:
    app: grafana-tempo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "5Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-tempo
  labels:
    app: grafana-tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-tempo
  template:
    metadata:
      annotations:
        checksum/tempo-config: d3bc8230a4d1ecd5f5165d8cb2c29156d114237664f526faff524c19ce13c69c
      labels:
        app: grafana-tempo
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: tempo
          image: "docker.io/grafana/tempo:latest"
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/tempo/tempo.yaml
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            limits:
              cpu: "500m"
              memory: "768Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: storage
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: grafana-tempo-config
        - name: storage
          persistentVolumeClaim:
            claimName: grafana-tempo-storage
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-tempo
spec:
  type: ClusterIP
  selector:
    app: grafana-tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
