---
- name: Install the Strimzi operator (watching namespace default)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig_path: "{{ lookup('env', 'KUBECONFIG') | default(playbook_dir ~ '/../kubeconfig-generated.yaml', true) }}"
    strimzi_timeout: "{{ lookup('env', 'STRIMZI_TIMEOUT') | default('300s', true) }}"
  tasks:
    # apply (idempotent) into default; operator watches default.
    - name: Install/ensure Strimzi operator
      ansible.builtin.command:
        argv: [kubectl, apply, -f, "https://strimzi.io/install/latest?namespace=default"]
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: Wait for the Kafka CRD to be Established
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: kafkas.kafka.strimzi.io
      register: kafka_crd
      until: >-
        kafka_crd.resources | length > 0 and
        (kafka_crd.resources[0].status.conditions | default([])
         | selectattr('type', 'equalto', 'Established')
         | selectattr('status', 'equalto', 'True') | list | length > 0)
      retries: 30
      delay: 10

    - name: Wait for the cluster operator rollout
      ansible.builtin.command:
        argv: [kubectl, rollout, status, deployment/strimzi-cluster-operator, -n, default, --timeout, "{{ strimzi_timeout }}"]
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false
