apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ui
spec:
  tls:
    - hosts:
        - web-ui.sXXXXXXX-at-student-dhbw-mannheim-de.users.dhbw.site
  rules:
    - host: web-ui.sXXXXXXX-at-student-dhbw-mannheim-de.users.dhbw.site
      http:
        paths:
          # Same-origin API paths used by the browser. Keeping these on the
          # web-ui host avoids depending on a second browser-visible DNS name.
          - path: /translate
            pathType: Prefix
            backend:
              service:
                name: translation-api
                port:
                  number: 8000
          - path: /languages
            pathType: Exact
            backend:
              service:
                name: translation-api
                port:
                  number: 8000
          - path: /loaded-pairs
            pathType: Prefix
            backend:
              service:
                name: translation-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-ui
                port:
                  number: 80
