# Go HTTP gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: translation-api
  labels:
    app: translation-api
spec:
  # One replica per availability zone
  replicas: 3
  selector:
    matchLabels:
      app: translation-api
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
      labels:
        app: translation-api
    spec:
      # Spread replicas across zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels:
              # Must match the pod labels above
              app: translation-api
          # Allow imbalance to not block scheduling
          whenUnsatisfiable: ScheduleAnyway
      containers:
        - name: translation-api
          image: registry.sXXXXXXX-at-student-dhbw-mannheim-de.users.dhbw.site/translation-api:latest
          ports:
            - containerPort: 8000
          env:
            # In-cluster URL of the translation backend
            - name: TRANSLATION_LLM_URL
              value: "http://translation-llm:8000"
            # First request for a non-preloaded model may download weights from HF
            - name: TRANSLATION_BACKEND_TIMEOUT
              value: "120s"
            - name: DEFAULT_SRC
              value: "local"
            - name: DEMO_USER_ID
              value: "demo-user"
            # Empty allows all pairs; comma-separated src-tgt enables allowlist mode
            - name: SUPPORTED_PAIRS
              value: ""
            # Publish translation events to Kafka for the streaming pipeline
            - name: KAFKA_ENABLED
              value: "true"
            - name: KAFKA_BROKERS
              value: "translation-kafka-kafka-bootstrap:9092"
            - name: KAFKA_TRANSLATION_EVENTS_TOPIC
              value: "translation-events"
            - name: KAFKA_TRANSLATION_ERRORS_TOPIC
              value: "translation-errors"
            - name: KAFKA_WRITE_TIMEOUT
              value: "2s"
            # OTLP gRPC endpoint for traces; unset = tracing disabled (no-op)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "grafana-tempo:4317"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 15
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 1
