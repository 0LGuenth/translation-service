<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .box{rx:10;ry:10;stroke-width:1.5;}
      .t{font-size:14px;font-weight:600;fill:#0f172a;}
      .s{font-size:12px;fill:#334155;}
      .lbl{font-size:12px;fill:#334155;}
      .grp{font-size:13px;font-weight:700;fill:#475569;}
      .app{fill:#e0f2fe;stroke:#0284c7;}
      .stream{fill:#fef9c3;stroke:#ca8a04;}
      .store{fill:#dcfce7;stroke:#16a34a;}
      .serve{fill:#ede9fe;stroke:#7c3aed;}
      .obs{fill:#f1f5f9;stroke:#64748b;}
      .edge{stroke:#334155;stroke-width:1.6;fill:none;}
      .edged{stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:4 4;fill:none;}
    </style>
  </defs>

  <text x="30" y="42" font-size="20" font-weight="700" fill="#0f172a">Translation Analytics — Kappa-Streaming-Pipeline auf Kubernetes</text>

  <!-- Web-UI -->
  <rect class="box app" x="40" y="125" width="175" height="85"/>
  <text class="t" x="56" y="156">Web-UI (Nginx)</text>
  <text class="s" x="56" y="178">Deployment + HPA</text>
  <text class="s" x="56" y="196">Datenlieferant</text>

  <!-- Translation API -->
  <rect class="box app" x="315" y="108" width="215" height="122"/>
  <text class="t" x="331" y="137">Translation API (Go)</text>
  <text class="s" x="331" y="159">Deployment ×3 + HPA 3–8</text>
  <text class="s" x="331" y="177">Router · Kafka-Producer</text>
  <text class="s" x="331" y="195">OTel-Tracing (Egress)</text>

  <!-- Translation LLM -->
  <rect class="box app" x="315" y="330" width="215" height="118"/>
  <text class="t" x="331" y="360">Translation LLM (FastAPI)</text>
  <text class="s" x="331" y="383">StatefulSet ×3, HPA 3–6</text>
  <text class="s" x="331" y="401">OPUS-MT CPU, LRU-Cache</text>
  <text class="s" x="331" y="419">OTel-Server-Span</text>

  <!-- Kafka -->
  <rect class="box stream" x="600" y="115" width="185" height="100"/>
  <text class="t" x="616" y="145">Kafka (Strimzi)</text>
  <text class="s" x="616" y="167">3 Broker, RF 3, persistent</text>
  <text class="s" x="616" y="185">translation-events</text>
  <text class="s" x="616" y="203">translation-errors</text>

  <!-- Spark -->
  <rect class="box stream" x="855" y="105" width="235" height="130"/>
  <text class="t" x="871" y="133">Spark Structured Streaming</text>
  <text class="s" x="871" y="155">1 Driver + N Executors</text>
  <text class="s" x="871" y="173">Dynamic Allocation 1–4</text>
  <text class="s" x="871" y="191">Parsing · Enrichment</text>
  <text class="s" x="871" y="209">Windowing · Watermark</text>

  <!-- SeaweedFS -->
  <rect class="box store" x="855" y="335" width="235" height="112"/>
  <text class="t" x="871" y="365">SeaweedFS (S3A)</text>
  <text class="s" x="871" y="388">Delta Lakehouse</text>
  <text class="s" x="871" y="406">Bronze · Silver · Gold</text>
  <text class="s" x="871" y="424">+ Checkpoints</text>

  <!-- Analytics API -->
  <rect class="box serve" x="1180" y="115" width="255" height="105"/>
  <text class="t" x="1196" y="145">Analytics API (Go)</text>
  <text class="s" x="1196" y="167">/metrics/* aus PostgreSQL</text>
  <text class="s" x="1196" y="185">gewichtete Kennzahlen</text>
  <text class="s" x="1196" y="203">OTel-Tracing</text>

  <!-- PostgreSQL -->
  <rect class="box store" x="1180" y="335" width="255" height="112"/>
  <text class="t" x="1196" y="365">PostgreSQL (Serving)</text>
  <text class="s" x="1196" y="388">language_pair_windows</text>
  <text class="s" x="1196" y="406">user_alerts</text>
  <text class="s" x="1196" y="424">idempotenter Upsert</text>

  <!-- Observability band -->
  <rect class="box obs" x="40" y="575" width="1395" height="95"/>
  <text class="grp" x="58" y="606">Observability (Namespace translate-platform)</text>
  <text class="s" x="58" y="632">Prometheus (Metriken/cAdvisor) · Loki (Logs via Alloy-DaemonSet) · Tempo (Traces: API → LLM, Analytics) · Grafana (Dashboards)</text>
  <text class="s" x="58" y="652">Dashboards: Übersetzungs-Analytics · Kubernetes-Auslastung inkl. „Laufende Pods je Service" (Skalierung)</text>

  <!-- Edges -->
  <!-- UI -> API -->
  <path class="edge" d="M215,165 L313,150" marker-end="url(#arrow)"/>
  <text class="lbl" x="222" y="143">POST /translate</text>
  <!-- API -> LLM -->
  <path class="edge" d="M422,230 L422,328" marker-end="url(#arrow)"/>
  <text class="lbl" x="430" y="285">translate (traced)</text>
  <!-- API -> Kafka -->
  <path class="edge" d="M530,162 L598,162" marker-end="url(#arrow)"/>
  <text class="lbl" x="536" y="154">publish</text>
  <!-- Kafka -> Spark -->
  <path class="edge" d="M785,162 L853,162" marker-end="url(#arrow)"/>
  <text class="lbl" x="792" y="154">consume</text>
  <!-- Spark -> SeaweedFS -->
  <path class="edge" d="M972,235 L972,333" marker-end="url(#arrow)"/>
  <text class="lbl" x="980" y="288">Delta write</text>
  <!-- Spark -> Postgres (Gold upsert) -->
  <path class="edge" d="M1090,180 L1135,180 L1135,300 L1250,333" marker-end="url(#arrow)"/>
  <text class="lbl" x="1096" y="172">Gold upsert</text>
  <!-- Postgres -> Analytics (read) -->
  <path class="edge" d="M1320,333 L1320,222" marker-end="url(#arrow)"/>
  <text class="lbl" x="1328" y="285">read</text>
  <!-- Analytics -> UI/Grafana (serving back), routed high above the boxes -->
  <path class="edge" d="M1300,115 L1300,74 L127,74 L127,123" marker-end="url(#arrow)"/>
  <text class="lbl" x="720" y="67">/metrics/* → Dashboards / UI</text>

  <!-- Observability dashed collectors -->
  <path class="edged" d="M127,210 L127,573" marker-end="url(#arrowdash)"/>
  <path class="edged" d="M422,448 L422,573" marker-end="url(#arrowdash)"/>
  <path class="edged" d="M972,447 L972,573" marker-end="url(#arrowdash)"/>
  <path class="edged" d="M1320,447 L1320,573" marker-end="url(#arrowdash)"/>

  <!-- Legend -->
  <text class="grp" x="40" y="716">Legende</text>
  <rect class="box app" x="40" y="738" width="20" height="15"/><text class="s" x="68" y="751">Anwendungsservices (eigene Container)</text>
  <rect class="box stream" x="420" y="738" width="20" height="15"/><text class="s" x="448" y="751">Streaming / Verarbeitung</text>
  <rect class="box store" x="710" y="738" width="20" height="15"/><text class="s" x="738" y="751">Speicher / Lakehouse</text>
  <rect class="box serve" x="990" y="738" width="20" height="15"/><text class="s" x="1018" y="751">Serving</text>
  <rect class="box obs" x="1160" y="738" width="20" height="15"/><text class="s" x="1188" y="751">Observability</text>
  <line class="edged" x1="40" y1="778" x2="82" y2="778" marker-end="url(#arrowdash)"/><text class="s" x="90" y="782">gestrichelt = Telemetrie-Erfassung</text>
</svg>
